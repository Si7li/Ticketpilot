[project]
name = "ticketpilot"
version = "0.1.0"
description = "Agentic support-triage system with hybrid RAG for Kestrel Outfitters (fictional)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langgraph",
    "langgraph-checkpoint-sqlite",
    "langchain-anthropic",
    "langchain-core",
    "pydantic>=2",
    "pydantic-settings",
    "rank-bm25",
    "fastembed",
    "qdrant-client",
    "fastapi",
    "uvicorn[standard]",
    "streamlit",
    "httpx",
    "datasets",
    "pyyaml",
    "matplotlib",
]

[project.optional-dependencies]
langfuse = ["langfuse"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "pre-commit",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ticketpilot"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "evals", "scripts"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM300"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"evals/*" = ["E501"]  # report generators build long Markdown f-strings
"scripts/*" = ["E501"]  # CLI/report output

[tool.ruff.lint.isort]
known-first-party = ["ticketpilot", "tests", "evals", "scripts"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["ticketpilot"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["rank_bm25.*", "fastembed.*", "datasets.*", "streamlit.*", "langfuse.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.coverage.run]
source = ["src/ticketpilot"]
omit = [
    "src/ticketpilot/llm/anthropic_backend.py",
    "src/ticketpilot/review_ui/*",
]
